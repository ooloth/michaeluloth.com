# Keeps the npm packages and the SHA-pinned actions in .github/workflows current.
#
# Version updates arrive at most monthly, and only for releases at least 7 days old, so a
# compromised release has time to be found and pulled. Minor and patch updates are grouped into
# one PR per ecosystem. Majors open as their own PRs, so one breaking upgrade cannot block the
# rest, and the PR limit leaves room for them beside the group. Packages that only work at matching
# versions are the exception, in groups of their own that take majors too. Security updates ignore
# the version-update groups and would open one PR per package, so they get their own group, which
# also leaves majors to their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Each of these sets is pinned or released in step, so one package moving alone can fail the
      # checks. They arrive as one PR each, majors included. Dependabot gives a dependency to the
      # first group that matches, so these come before the catch-all.
      next:
        applies-to: version-updates
        patterns: [next, eslint-config-next]
      react:
        applies-to: version-updates
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      vitest:
        applies-to: version-updates
        patterns: [vitest, '@vitest/*']
      npm:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
