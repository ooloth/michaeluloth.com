# Keeps the npm packages and the SHA-pinned actions in .github/workflows
# current. Each ecosystem gets at most one PR a month, with every update grouped
# into it. A release is only proposed once it is 7 days old, so a compromised
# one has time to be found and pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - '*'
    # A major version can break the checks and block the whole grouped PR, so
    # majors are upgraded deliberately instead.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
